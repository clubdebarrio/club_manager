{% extends "base.html" %}

{% block title %}Seleccionar Mes para Imprimir{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <h1>Imprimir Cuotas</h1>
        <p class="sub">Elegí el período para previsualizar y generar el PDF</p>
    </div>
    <div class="actions">
        <a href="{{ url_for('cuotas.listar') }}" class="btn btn-secondary btn-sm">
            <i class="fas fa-arrow-left" aria-hidden="true"></i> Volver
        </a>
    </div>
</div>

<form method="POST">
    <div class="form-card">
        <h2 class="section-title"><i class="fas fa-print" aria-hidden="true"></i> Período a imprimir</h2>
        <p class="section-sub">Vas a ver la lista de cuotas del mes antes de generar el PDF.</p>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="mes" class="form-label">Mes</label>
                <select name="mes" id="mes" class="form-select">
                    {% for m in range(1, 13) %}
                        <option value="{{ m }}" {% if m == 7 %}selected{% endif %}>{{ m }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label for="ano" class="form-label">Año</label>
                <select name="ano" id="ano" class="form-select">
                    {% for a in range(2024, 2031) %}
                        <option value="{{ a }}" {% if a == 2026 %}selected{% endif %}>{{ a }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Continuar</button>
            <a href="{{ url_for('cuotas.listar') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </div>
</form>
{% endblock %}
