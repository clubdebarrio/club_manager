<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Conectando ChytaPay...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f8f9fa;
            color: #333;
        }
        .box {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { margin: 0 0 8px; font-size: 20px; }
        p { color: #666; margin: 0; }
        a { color: #0d6efd; text-decoration: none; margin-top: 16px; display: inline-block; }
    </style>
</head>
<body>
<div class="box" id="content">
    <div class="icon">⏳</div>
    <h2>Conectando ChytaPay...</h2>
    <p>Esperá un momento, estamos cerrando esta ventana.</p>
</div>

<script>
(function () {
    var exito = {{ 'true' if exito else 'false' }};
    var errorMsg = {{ (error_msg or '') | tojson }};

    // Avisar al opener (la pestaña del panel de ChytaPay)
    try {
        if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
                type: 'chytapay_oauth_done',
                success: exito,
                error: errorMsg
            }, '*');
        }
    } catch (e) {
        console.error('Error enviando mensaje al opener:', e);
    }

    // Cerrar el popup automáticamente
    setTimeout(function () {
        try {
            window.close();
        } catch (e) {
            console.error('No se pudo cerrar el popup:', e);
        }
    }, 3000);

    // Fallback: si después de 800ms el popup sigue abierto,
    // mostrar un mensaje con link manual
    setTimeout(function () {
        var content = document.getElementById('content');
        if (exito) {
            content.innerHTML =
                '<div class="icon">✅</div>' +
                '<h2>Cuenta conectada</h2>' +
                '<p>Ya podés cerrar esta ventana y volver al sistema.</p>' +
                '<a href="{{ redirect_url }}">Volver al panel de ChytaPay</a>';
        } else {
            content.innerHTML =
                '<div class="icon">❌</div>' +
                '<h2>No se pudo conectar</h2>' +
                '<p>' + errorMsg + '</p>' +
                '<a href="{{ redirect_url }}">Volver al panel de ChytaPay</a>';
        }
    }, 800);
})();
</script>
</body>
</html>
