{% extends "base.html" %}

{% block title %}Acción bloqueada{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body text-center p-4">
                        <span class="chip chip--bad mb-3"><i class="fas fa-user-secret" aria-hidden="true"></i> Suplantación activa</span>
                        <h2 class="h5 mb-2">Acción no permitida</h2>
                        <p class="text-muted mb-1">
                            No podés realizar esta acción mientras estás suplantando a otro usuario.
                        </p>
                        <p class="text-muted small">
                            Para hacerlo, primero salí de la suplantación.
                        </p>
                        <form method="POST" action="{{ url_for('sistema.salir_impersonation') }}" class="mt-3">
                            <button type="submit" class="btn btn-primary btn-solid">
                                <i class="fas fa-arrow-right-from-bracket" aria-hidden="true"></i>
                                Salir de la suplantación
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
