<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - Club Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .error-box { text-align: center; background: white; padding: 3rem; border-radius: 1rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; }
        .error-code { font-size: 6rem; font-weight: bold; color: #1c2e28; line-height: 1; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">404</div>
        <h2 class="mb-3">Página no encontrada</h2>
        <p class="text-muted mb-4">La página que estás buscando no existe, fue eliminada o cambió de dirección.</p>
        <a href="/" class="btn btn-dark">Volver al inicio</a>
    </div>
</body>
</html>
