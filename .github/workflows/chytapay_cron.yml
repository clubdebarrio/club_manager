name: Procesar ChytaPay Pendientes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping_vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al Endpoint de Vercel
        run: |
          curl -X POST "https://www.miclubdebarrio.com.ar/api/tasks/chytapay-pendientes" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"