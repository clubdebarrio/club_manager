name: Procesar ChytaPay Pendientes

on:
  schedule:
    # Se ejecuta cada 5 minutos
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions de GitHub

jobs:
  ping_vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al Endpoint de Vercel
        run: |
          curl -X POST https://www.miclubdebarrio.com.ar/api/tasks/chytapay-pendientes \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"